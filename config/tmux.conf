# tmux configuration — screen muscle memory, tuned for Claude Code
# managed in ~/src/dotfiles/config/tmux.conf, symlinked to ~/.tmux.conf
#
# Reload after editing:  C-a r   (or: tmux source-file ~/.tmux.conf)

### prefix and screen muscle memory ###########################################

set -g prefix C-a
unbind C-b
bind a      send-prefix                 # C-a a    -> literal C-a
bind C-a    last-window                 # C-a C-a  -> toggle last window

bind Space  next-window
bind BSpace previous-window
bind A      command-prompt -I "#W" "rename-window -- '%%'"
bind '"'    choose-tree -Zw             # screen's window list
bind "'"    command-prompt -p "window:" "select-window -t '%%'"
bind Escape copy-mode
bind ']'    paste-buffer
bind K      confirm-before -p "kill window #W? (y/n)" kill-window
bind r      source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# splits open in the current directory; S/| follow screen, %/" stay unbound
bind S      split-window -v -c "#{pane_current_path}"
bind '|'    split-window -h -c "#{pane_current_path}"
bind c      new-window   -c "#{pane_current_path}"
bind Tab    select-pane -t :.+

### Claude Code plumbing ######################################################
# https://code.claude.com/docs/en/terminal-config#configure-tmux
# allow-passthrough lets Claude Code's notifications and progress bar reach the
# outer terminal; the extended-keys pair lets tmux tell Shift+Enter from Enter.

set -g  allow-passthrough on
set -s  extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g  default-terminal "tmux-256color"
set -s  escape-time 10                  # low, but not 0: 0 splits escape seqs
set -g  focus-events on
set -g  history-limit 50000             # Claude output blows past the 2000 default
setw -g aggressive-resize on

# Apple Terminal is 256-colour only. On Ghostty / iTerm2 / WezTerm, uncomment:
# set -as terminal-features ",xterm-256color:RGB"

### window naming from Claude Code sessions ###################################
# Claude Code publishes its current task as the pane title, prefixed with a
# state glyph (* idle / waiting for you, braille spinner = working). The status
# format below surfaces that title for claude panes and falls back to the plain
# window name everywhere else. No hooks involved.

set -g  base-index 0
set -g  renumber-windows on
setw -g allow-rename off                # don't let apps rewrite the window name
set -g  status-interval 5               # refresh rate of the working/idle glyph

set -g window-status-format         " #I #{?#{m:*claude*,#{pane_current_command}},#{=/28/…:pane_title},#W}#{?window_flags,#{window_flags},} "
set -g window-status-current-format " #I #{?#{m:*claude*,#{pane_current_command}},#{=/28/…:pane_title},#W}#{?window_flags,#{window_flags},} "

# mirror the same thing into the Terminal.app title bar
set -g set-titles on
set -g set-titles-string "#{?#{m:*claude*,#{pane_current_command}},#{pane_title},#S:#I #W}"

### which window wants you ####################################################
# Claude Code rings the bell when it needs input (preferredNotifChannel =
# terminal_bell in ~/.claude/settings.json). tmux flags that window red with a
# "!" until you visit it — the one thing the pane title can't tell you.

setw -g monitor-bell on
setw -g monitor-activity off
set -g  bell-action any
set -g  visual-bell off

### status line ###############################################################

set -g status-justify left
set -g status-style "bg=colour236,fg=colour250"

set -g status-left "#[bg=colour30,fg=colour231,bold] #S #[default] "
set -g status-left-length 20

set -g status-right "#[fg=colour244]%a %d.%m.%Y #[fg=colour231,bold]%H:%M "
set -g status-right-length 40

set -g window-status-separator ""
set -g window-status-style          "bg=colour236,fg=colour248"
set -g window-status-current-style  "bg=colour31,fg=colour231,bold"
set -g window-status-bell-style     "bg=colour160,fg=colour231,bold"
set -g window-status-activity-style "bg=colour236,fg=colour214"

set -g display-time 2000
set -g message-style "bg=colour31,fg=colour231,bold"

### mouse and copy ############################################################
# Apple Terminal has no OSC 52, so copy goes through pbcopy.
# With mouse on, hold Fn while dragging for Terminal.app's native selection,
# or press C-a m to switch mouse reporting off entirely.

set -g  mouse on
bind m  set -g mouse \; display "mouse #{?mouse,on,off}"

setw -g mode-keys vi
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
